<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mini Crossword</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="loading">
    <!-- Loading screen: plain HTML/CSS so it shows instantly, before any JavaScript runs.
         main.ts fades it out once the puzzle is on screen. -->
    <div id="loader" class="loader" role="status" aria-live="polite">
      <div class="loader-grid" aria-hidden="true">
        <span style="--i: 0"></span><span style="--i: 1"></span><span style="--i: 2"></span>
        <span style="--i: 1"></span><span class="black"></span><span style="--i: 3"></span>
        <span style="--i: 2"></span><span style="--i: 3"></span><span style="--i: 4"></span>
      </div>
      <p class="loader-title">Mini Crossword</p>
      <p id="loader-text" class="muted">Loading…</p>
    </div>

    <header class="top">
      <div class="title">
        <h1 id="title">Mini Crossword</h1>
        <span id="byline" class="muted"></span>
      </div>
      <div class="top-right">
        <div id="me" class="me"></div>
        <div class="timer" aria-label="Time"><span data-icon="clock"></span><span id="timer">0:00</span></div>
      </div>
    </header>

    <!-- Puzzle / Results switcher. Results stays locked until today's attempt is over. -->
    <nav id="tabs" class="tabs" role="tablist" hidden>
      <button id="tab-puzzle" role="tab" aria-controls="view-puzzle" aria-selected="true"><span data-icon="grid"></span>Puzzle</button>
      <button id="tab-results" role="tab" aria-controls="view-results" aria-selected="false" aria-disabled="true">
        <span data-icon="lock" id="results-icon"></span>Results
      </button>
    </nav>

    <main id="view-puzzle" class="layout" role="tabpanel" aria-labelledby="tab-puzzle">
      <section class="play">
        <div class="clue-bar">
          <button id="prev-clue" class="icon-btn" aria-label="Previous clue"><span data-icon="chevron-left"></span></button>
          <button id="clue-text" class="clue-text" aria-label="Switch direction"></button>
          <button id="next-clue" class="icon-btn" aria-label="Next clue"><span data-icon="chevron-right"></span></button>
        </div>

        <div class="board-wrap">
          <div id="board" class="board"></div>
          <!-- Invisible input that holds keyboard focus, so tapping a cell opens the on-screen keyboard on mobile. -->
          <input id="kbd" class="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next" aria-label="Crossword input" />
        </div>

        <div id="tools" class="tools">
          <button data-action="check-cell">Check cell</button>
          <button data-action="check-puzzle">Check puzzle</button>
          <button data-action="reveal-cell">Reveal cell</button>
          <button data-action="clear" data-confirm="Clear all?">Clear</button>
          <button data-action="give-up" data-confirm="Really give up?" class="danger">Give up</button>
        </div>

        <!-- Shown instead of the tools once the attempt is over. -->
        <div id="over-bar" class="over-bar" hidden>
          <span id="over-text"></span>
          <button id="see-results" class="primary">See results</button>
        </div>
      </section>

      <section class="clues">
        <div><h2>Across</h2><ol id="across"></ol></div>
        <div><h2>Down</h2><ol id="down"></ol></div>
      </section>
    </main>

    <main id="view-results" class="results" role="tabpanel" aria-labelledby="tab-results" hidden></main>

    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
